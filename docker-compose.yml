```yaml
services:
  user-service:
    image: 762052017474.dkr.ecr.us-east-1.amazonaws.com/user-service:ci-jenkins-5
    container_name: user-service
    expose: ["5001"]
    restart: unless-stopped
    networks: [app-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  product-service:
    image: 762052017474.dkr.ecr.us-east-1.amazonaws.com/product-service:ci-jenkins-5
    container_name: product-service
    expose: ["5002"]
    restart: unless-stopped
    networks: [app-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  order-service:
    image: 762052017474.dkr.ecr.us-east-1.amazonaws.com/order-service:ci-jenkins-5
    container_name: order-service
    expose: ["5003"]
    environment:
      USER_SERVICE_URL: http://user-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    restart: unless-stopped
    networks: [app-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: api-gateway
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [user-service, product-service, order-service]
    restart: unless-stopped
    networks: [app-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped
    networks: [app-network]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeThisPassword123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [app-network]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose: ["9100"]
    networks: [app-network]

networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
```
